name: Main

on:
  push:
    branches:
      - main

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ROLLUP_DISABLE_NATIVE: "1"
      SKIP_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --workspaces
      - name: Verify
        run: npm run verify

  deploy-api:
    runs-on: ubuntu-latest
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMAIL_INGESTION_SECRET: ${{ secrets.EMAIL_INGESTION_SECRET }}
      SKIP_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --workspaces
      - name: Apply production migrations
        run: npm --workspace apps/api run db:migrate:remote
      - name: Deploy API
        run: npm --workspace apps/api run deploy:unsafe
      - name: Apply API Worker secrets
        run: |
          node -e "if (!process.env.EMAIL_INGESTION_SECRET) throw new Error('EMAIL_INGESTION_SECRET is required'); require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/ftops-api-secrets.json', JSON.stringify({ EMAIL_INGESTION_SECRET: process.env.EMAIL_INGESTION_SECRET }))"
          npm --workspace apps/api exec -- wrangler secret bulk "$RUNNER_TEMP/ftops-api-secrets.json"
          node -e "require('node:fs').unlinkSync(process.env.RUNNER_TEMP + '/ftops-api-secrets.json')"

  deploy-webhooks:
    runs-on: ubuntu-latest
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SKIP_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --workspaces
      - name: Deploy Webhooks
        run: npm --workspace apps/webhooks run deploy:unsafe

  deploy-email:
    runs-on: ubuntu-latest
    needs:
      - verify
      - deploy-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMAIL_INGESTION_SECRET: ${{ secrets.EMAIL_INGESTION_SECRET }}
      SKIP_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --workspaces
      - name: Deploy Email Worker
        run: npm --workspace apps/email run deploy:unsafe
      - name: Apply Email Worker secrets
        run: |
          node -e "if (!process.env.EMAIL_INGESTION_SECRET) throw new Error('EMAIL_INGESTION_SECRET is required'); require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/ftops-email-secrets.json', JSON.stringify({ EMAIL_INGESTION_SECRET: process.env.EMAIL_INGESTION_SECRET }))"
          npm --workspace apps/email exec -- wrangler secret bulk "$RUNNER_TEMP/ftops-email-secrets.json"
          node -e "require('node:fs').unlinkSync(process.env.RUNNER_TEMP + '/ftops-email-secrets.json')"
      - name: Configure workspace email mailbox
        run: npm --workspace apps/api exec -- wrangler d1 execute ftops-db --remote --file=production/email-routing.sql
      - name: Configure Email Routing subdomain
        run: node apps/email/scripts/configure-production-routing.mjs
        env:
          EMAIL_ROUTING_ZONE_ID: 982a2f6326b49667cacb772402329374
          EMAIL_ROUTING_SUBDOMAIN: ops.fromtrees.studio
          EMAIL_ROUTING_ADDRESS: notes@ops.fromtrees.studio
          EMAIL_ROUTING_WORKER: ftops-email

  deploy-ui:
    runs-on: ubuntu-latest
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SKIP_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --workspaces
      - name: Deploy UI
        run: npm run deploy:ui

  terraform-apply:
    runs-on: ubuntu-latest
    needs:
      - deploy-api
      - deploy-webhooks
      - deploy-email
      - deploy-ui
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra/cloudflare/zero-trust
      - name: Terraform init
        run: terraform init -input=false
        working-directory: infra/cloudflare/zero-trust
      - name: Import existing legal Access applications
        run: node tools/import-existing-legal-apps.mjs
        working-directory: infra/cloudflare/zero-trust
      - name: Terraform validate
        run: terraform validate
        working-directory: infra/cloudflare/zero-trust
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra/cloudflare/zero-trust
